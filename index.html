<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Anagramy i wzorce</title>

<style>
/* tryb jasny */
:root {
    --bg-color: #ffffff;
    --text-color: #333333;
    --card-bg: #eef3ff;
    --card-text: #1a365d;
    --input-bg: #ffffff;
    --input-border: #ccc;
    --label-color: #555555;
    --button-bg: #f0f0f0;
    --button-border: #ccc;
}

/* tryb ciemny */
[data-theme="dark"] {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1e293b;
    --card-text: #93c5fd;
    --input-bg: #1e1e1e;
    --input-border: #444444;
    --label-color: #aaa;
    --button-bg: #2d2d2d;
    --button-border: #444;
}

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 15px;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
}

.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

/* Przycisk zmiany motywu */
.theme-toggle {
    background: var(--button-bg);
    color: var(--text-color);
    border: 1px solid var(--button-border);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background-color 0.3s, border-color 0.3s;
}

.theme-toggle:hover {
    opacity: 0.8;
}

input {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    box-sizing: border-box;
    background-color: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
}

.section {
    margin-top: 30px;
}

.pattern-filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.pattern-filters .field {
    flex: 1;
    min-width: 180px;
}

.pattern-filters label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: var(--label-color);
}

.results {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.word {
    background: var(--card-bg);
    color: var(--card-text);
    padding: 5px 10px;
    border-radius: 5px;
    transition: background-color 0.3s, color 0.3s;
}

#loading {
    font-size: 1.1em;
}
</style>
</head>
<body>

<div class="header-bar">
    <h1>Wyszukiwarka słów</h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Zmień motyw">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Tryb ciemny</span>
    </button>
</div>

<div id="loading">
Ładowanie słownika...
</div>

<div id="app" hidden>

<div id="stats"></div>

<div class="section">
<h2>Anagramy</h2>

<input
id="anagramInput"
placeholder="np. notka">

<div
id="anagramResults"
class="results"></div>
</div>

<div class="section">
<h2>Brakujące litery</h2>

<div class="pattern-filters">
    <div class="field" style="flex: 1.5;">
        <label for="patternInput">Wzorzec (użyj kropek):</label>
        <input id="patternInput" placeholder="np. red.kcja">
    </div>
    
    <div class="field">
        <label for="includeInput">Muszą wystąpić litery:</label>
        <input id="includeInput" placeholder="np. ka">
    </div>
    
    <div class="field">
        <label for="excludeInput">Nie mogą wystąpić:</label>
        <input id="excludeInput" placeholder="np. xyz">
    </div>
</div>

<div
id="patternResults"
class="results"></div>
</div>

</div>

<script>

// --- Obsługa trybu ciemnego/jasnego (domyślnie ciemny) ---
const themeToggleBtn = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeText = document.getElementById('themeText');

function setTheme(theme) {
    if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Tryb ciemny';
        localStorage.setItem('theme', 'light');
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Tryb jasny';
        localStorage.setItem('theme', 'dark');
    }
}

// Inicjalizacja motywu (Domyślnie 'ciemny', chyba że w localStorage zapisano 'jasny')
const savedTheme = localStorage.getItem('theme');

if (savedTheme === 'light') {
    setTheme('light');
} else {
    setTheme('dark');
}

themeToggleBtn.addEventListener('click', () => {
    const isDark = document.documentElement.hasAttribute('data-theme');
    setTheme(isDark ? 'light' : 'dark');
});


// --- Logika wyszukiwarki ---
let words = [];

const anagramIndex = new Map();
const lengthIndex = new Map();

function normalize(word){
    return word.trim().toLowerCase();
}

function anagramKey(word){
    return [...normalize(word)]
        .sort((a,b)=>a.localeCompare(b,'pl'))
        .join('');
}

async function loadDictionary(){
    const response = await fetch("slowa.txt");
    const text = await response.text();

    return text
        .split(/\r?\n/)
        .map(w=>w.trim())
        .filter(Boolean);
}

function buildIndexes(){
    for(const word of words){
        const lowerWord = word.toLowerCase();
        const len = lowerWord.length;

        if(!lengthIndex.has(len)){
            lengthIndex.set(len, []);
        }

        lengthIndex.get(len).push(word);

        const key = anagramKey(word);

        if(!anagramIndex.has(key)){
            anagramIndex.set(key, []);
        }
        anagramIndex.get(key).push(word);
    }
}

function showResults(container, results){
    container.innerHTML = "";

    if(results.length === 0){
        container.textContent = "Brak wyników.";
        return;
    }

    const fragment = document.createDocumentFragment();

    for(const word of results){
        const div = document.createElement("div");
        div.className = "word";
        div.textContent = word;
        fragment.appendChild(div);
    }

    container.appendChild(fragment);
}

function findAnagrams(text){
    text = text.trim();
    if(!text) return [];

    const key = anagramKey(text);

    return (anagramIndex.get(key) || [])
        .slice()
        .sort((a,b) => a.localeCompare(b,'pl'));
}

function findPattern(pattern, includeLetters, excludeLetters){
    pattern = pattern.trim();
    if(!pattern) return [];

    const candidates = lengthIndex.get(pattern.length) || [];

    const regex = new RegExp(
        "^" + pattern.replace(/\./g, "[a-ząćęłńóśźżA-ZĄĆĘŁŃÓŚŹŻ]") + "$",
        "ui" 
    );

    const required = [...normalize(includeLetters)];
    const forbidden = [...normalize(excludeLetters)];

    return candidates.filter(word => {
        const lowerWord = word.toLowerCase();

        if (!regex.test(word)) return false;

        for (const char of required) {
            if (!lowerWord.includes(char)) return false;
        }

        for (const char of forbidden) {
            if (lowerWord.includes(char)) return false;
        }

        return true;
    });
}

function setupSearch(){
    const anagramInput = document.getElementById("anagramInput");
    const patternInput = document.getElementById("patternInput");
    const includeInput = document.getElementById("includeInput");
    const excludeInput = document.getElementById("excludeInput");
    
    const anagramResults = document.getElementById("anagramResults");
    const patternResults = document.getElementById("patternResults");

    const updatePatternResults = () => {
        showResults(
            patternResults, 
            findPattern(patternInput.value, includeInput.value, excludeInput.value)
        );
    };

    anagramInput.addEventListener("input", () => {
        showResults(anagramResults, findAnagrams(anagramInput.value));
    });

    patternInput.addEventListener("input", updatePatternResults);
    includeInput.addEventListener("input", updatePatternResults);
    excludeInput.addEventListener("input", updatePatternResults);
}

async function init(){
    words = await loadDictionary();
    buildIndexes();

    document.getElementById("stats").textContent =
        "Załadowano " + words.length.toLocaleString("pl-PL") + " słów.";

    document.getElementById("loading").hidden = true;
    document.getElementById("app").hidden = false;

    setupSearch();
}

init();

</script>

</body>
</html>
