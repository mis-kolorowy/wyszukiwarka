<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Anagramy i wzorce</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:20px auto;
    padding:15px;
}

input{
    width:100%;
    max-width:500px;
    padding:10px;
    font-size:18px;
}

.section{
    margin-top:30px;
}

.results{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.word{
    background:#eef3ff;
    padding:5px 10px;
    border-radius:5px;
}

#loading{
    font-size:1.1em;
}
</style>
</head>
<body>

<h1>Wyszukiwarka słów</h1>

<div id="loading">
Ładowanie słownika...
</div>

<div id="app" hidden>

<div id="stats"></div>

<div class="section">
<h2>Anagramy</h2>

<input
id="anagramInput"
placeholder="np. redukcja">

<div
id="anagramResults"
class="results"></div>
</div>

<div class="section">
<h2>Brakujące litery</h2>

<input
id="patternInput"
placeholder="np. red.kcja">

<div
id="patternResults"
class="results"></div>
</div>

</div>

<script>

let words = [];

const anagramIndex = new Map();
const lengthIndex = new Map();

function normalize(word){
    return word.trim().toLowerCase();
}

function anagramKey(word){
    return [...normalize(word)]
        .sort((a,b)=>a.localeCompare(b,'pl'))
        .join('');
}

async function loadDictionary(){
    const response = await fetch("slowa.txt");
    
    if (!response.ok) {
        throw new Error(`Nie udało się załadować pliku (Status: ${response.status})`);
    }

    const text = await response.text();

    return text
        .split(/\r?\n/)
        .map(w=>w.trim())
        .filter(Boolean);
}

function buildIndexes(){
    for(const word of words){
        const normalizedWord = word.toLowerCase();
        const len = normalizedWord.length;

        if(!lengthIndex.has(len)){
            lengthIndex.set(len,[]);
        }
        lengthIndex.get(len).push(normalizedWord);

        const key = anagramKey(word);

        if(!anagramIndex.has(key)){
            anagramIndex.set(key,[]);
        }
        anagramIndex.get(key).push(word);
    }
}

function showResults(container,results){
    container.innerHTML="";

    if(results.length===0){
        container.textContent="Brak wyników.";
        return;
    }

    const fragment = document.createDocumentFragment();

    for(const word of results){
        const div = document.createElement("div");
        div.className="word";
        div.textContent=word;
        fragment.appendChild(div);
    }

    container.appendChild(fragment);
}

function findAnagrams(text){
    text = text.trim();
    if(!text) return [];

    const key = anagramKey(text);

    return (anagramIndex.get(key)||[])
        .slice()
        .sort((a,b)=>a.localeCompare(b,'pl'));
}

function findPattern(pattern){
    pattern = pattern.trim().toLowerCase();

    if(!pattern) return [];

    const candidates = lengthIndex.get(pattern.length) || [];

    const regex = new RegExp(
        "^" +
        pattern.replace(/\./g, "[a-ząćęłńóśźżA-ZĄĆĘŁŃÓŚŹŻ]") +
        "$",
        "i"
    );

    return candidates.filter(
        word => regex.test(word)
    );
}

function setupSearch(){
    const anagramInput = document.getElementById("anagramInput");
    const patternInput = document.getElementById("patternInput");
    const anagramResults = document.getElementById("anagramResults");
    const patternResults = document.getElementById("patternResults");

    anagramInput.addEventListener("input", ()=>{
        showResults(anagramResults, findAnagrams(anagramInput.value));
    });

    patternInput.addEventListener("input", ()=>{
        showResults(patternResults, findPattern(patternInput.value));
    });
}

async function init(){
    try {
        words = await loadDictionary();
        buildIndexes();

        document.getElementById("stats").textContent =
            "Załadowano " + words.length.toLocaleString("pl-PL") + " słów.";

        document.getElementById("loading").hidden = true;
        document.getElementById("app").hidden = false;

        setupSearch();
    } catch (error) {
        console.error(error);
        document.getElementById("loading").textContent = 
            "Błąd ładowania słownika! Szczegóły: " + error.message;
    }
}

init();
    
</script>

</body>
</html>
